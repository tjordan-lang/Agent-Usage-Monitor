name: AgentUsageMonitor
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  AgentUsageMonitor:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    resources:
      - App/Assets.xcassets
    dependencies:
      - target: AgentUsageMonitorWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tyronejordan.AgentUsageMonitor
        PRODUCT_NAME: Agent Usage Monitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AgentUsageMonitor.entitlements
  AgentUsageMonitorWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tyronejordan.AgentUsageMonitor.Widget
        PRODUCT_NAME: AgentUsageMonitorWidget
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/AgentUsageMonitorWidget.entitlements
